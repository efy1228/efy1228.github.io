<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Samples - Eric</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0a0a0a;
      color: #e5e5e5;
      font-family: "Poppins", sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar {
      background: rgba(17, 17, 17, 0.85);
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .nav-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      gap: 24px;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-container a {
      color: #aaa;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      transition: color 0.2s ease;
    }

    .nav-container a:hover,
    .nav-container a.active {
      color: hotpink;
    }

    /* Container */
    .container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px 80px;
      flex: 1;
    }

    /* Header */
    .header-section {
      padding: 20px 0 30px;
    }

    h1 {
      color: hotpink;
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      font-size: 1.05rem;
    }

    /* Gallery Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    /* Art Card with Scroll Animations */
    .card {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid #222;
      background: #111;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      
      /* Initial state for entrance animation */
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card.show {
      opacity: 1;
      transform: translateY(0);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .card:hover {
      border-color: hotpink;
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(255, 105, 180, 0.12);
    }

    .card:hover img {
      transform: scale(1.06);
    }

    /* Overlay Caption */
    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 16px 12px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
      font-size: 0.9rem;
      font-weight: 500;
      color: #fff;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }

    /* Image Lightbox Modal */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 0.3s ease;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }

    .lightbox.show {
      display: flex;
      opacity: 1;
    }

    .lightbox-img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid #222;
      object-fit: contain;
    }

    .lightbox-caption {
      margin-top: 16px;
      color: hotpink;
      font-size: 1rem;
      font-weight: 600;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 24px;
      color: #888;
      font-size: 32px;
      cursor: pointer;
      background: none;
      border: none;
      transition: color 0.2s ease;
    }

    .lightbox-close:hover {
      color: hotpink;
    }

    /* Footer */
    footer {
      border-top: 1px solid #1a1a1a;
      text-align: center;
      padding: 24px;
      color: #666;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.2rem;
      }
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html">HOME</a>
      <a href="Portfolio.html">LAB PORTFOLIO</a>
      <a href="3DRenders.html">3D RENDERS</a>
      <a href="ArtSamples.html" class="active">ART SAMPLES</a>
    </div>
  </nav>

  <div class="container">

    <header class="header-section">
      <h1>Art Samples</h1>
      <p class="subtitle">Digital illustrations, character studies, and concept artwork.</p>
      <p class="subtitle">THIS PAGE IS STILL A WIP. EXPECT IT TO BE VERY JANKY.</p>
    </header>

    <div class="grid">

      <div class="card" onclick="openLightbox('art/art1.jpg', 'Character Study')">
        <img src="art/art1.jpg" alt="Character Study">
        <div class="overlay">Character Study</div>
      </div>

      <div class="card" onclick="openLightbox('art/art2.jpg', 'Lighting Practice')">
        <img src="art/art2.jpg" alt="Lighting Practice">
        <div class="overlay">Lighting Practice</div>
      </div>

      <div class="card" onclick="openLightbox('art/art3.jpg', 'Sketch Render')">
        <img src="art/art3.jpg" alt="Sketch Render">
        <div class="overlay">Sketch Render</div>
      </div>

      <div class="card" onclick="openLightbox('art/art4.jpg', 'Concept Piece')">
        <img src="art/art4.jpg" alt="Concept Piece">
        <div class="overlay">Concept Piece</div>
      </div>

    </div>

  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img id="lightboxImg" class="lightbox-img" src="" alt="Enlarged Artwork">
    <div id="lightboxCaption" class="lightbox-caption"></div>
  </div>

  <footer>
    &copy; Eric. Designed with HTML & CSS.
  </footer>

  <script>
    // Smooth Fade-In Scroll Observer
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("show");
          }
        });
      },
      { threshold: 0.15 }
    );
    
    document.querySelectorAll(".card").forEach((card) => {
      observer.observe(card);
    });

    // Lightbox Logic
    function openLightbox(src, caption) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const lightboxCaption = document.getElementById('lightboxCaption');

      lightboxImg.src = src;
      lightboxCaption.textContent = caption;
      lightbox.classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      lightbox.classList.remove('show');
      document.body.style.overflow = 'auto';
      setTimeout(() => {
        document.getElementById('lightboxImg').src = '';
      }, 300);
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeLightbox();
      }
    });
  </script>

</body>
</html>
